<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-Flow | Main Menu</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff0055;
            --neon-green: #39ff14;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* LANDING PAGE OVERLAY */
        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }

        .menu-content { text-align: center; max-width: 500px; }
        h1 { font-size: 4rem; letter-spacing: 12px; margin: 0; font-weight: 200; color: var(--neon-blue); text-shadow: 0 0 30px var(--neon-blue); }
        
        .highscore-display { font-size: 1.2rem; margin: 20px 0; color: #aaa; border-top: 1px solid #333; border-bottom: 1px solid #333; padding: 10px 0; }
        .highscore-display b { color: var(--neon-pink); }

        .rules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 30px 0; text-align: left; font-size: 0.9rem; opacity: 0.8; }
        .rule-item { border-left: 2px solid var(--neon-blue); padding-left: 10px; }

        .start-btn {
            background: none; border: 2px solid var(--neon-blue); color: var(--neon-blue);
            padding: 15px 40px; font-size: 1.2rem; cursor: pointer; font-weight: bold;
            text-transform: uppercase; letter-spacing: 4px; transition: 0.3s;
        }
        .start-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 40px var(--neon-blue); }

        /* IN-GAME UI */
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(255, 255, 255, 0.03); padding: 15px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); display:none; }
        #stats { position: absolute; top: 20px; right: 20px; text-align: right; display:none; }
        #score-board { font-size: 4rem; font-weight: 900; color: var(--neon-blue); }
        #dash-container { width: 150px; height: 4px; background: rgba(255,255,255,0.1); margin-top: 10px; }
        #dash-bar { width: 100%; height: 100%; background: var(--neon-green); transition: width 0.1s linear; }
        canvas { display: block; background: #000; }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <div class="menu-content">
            <h1>HYPER<br>FLOW</h1>
            <div class="highscore-display">PREVIOUS BEST: <b id="menu-high-score">0</b></div>
            
            <div class="rules-grid">
                <div class="rule-item"><b>MOVE</b><br>A/D or Mouse Move</div>
                <div class="rule-item"><b>DASH</b><br>Double Tap or R-Click</div>
                <div class="rule-item"><b>EDGES</b><br>Do not touch boundaries</div>
                <div class="rule-item"><b>EVOLVE</b><br>Bricks grow at 100 pts</div>
            </div>

            <button class="start-btn" onclick="startGame()">Initialize Start</button>
        </div>
    </div>

    <div id="ui">
        <div id="dash-container"><div id="dash-bar"></div></div>
        <p style="font-size: 9px; margin-top: 5px; opacity: 0.6;">DASH READY</p>
    </div>

    <div id="stats">
        <div id="score-board">0</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score-board');
        const dashBar = document.getElementById('dash-bar');
        const menuHighScore = document.getElementById('menu-high-score');
        const menuOverlay = document.getElementById('menu-overlay');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let gameActive = false;
        let score = 0;
        let highScore = localStorage.getItem('hyperFlowBest') || 0;
        menuHighScore.innerText = highScore;

        let playerX = canvas.width / 2;
        const playerY = canvas.height - 150;
        let keys = {};
        let dashAvailable = true;
        let isDashing = false;
        let baseSpeed = 6;
        let lastSpeedBoost = Date.now();
        const hazardMargin = 35;
        let obstacles = [];
        let stars = [];
        
        // Touch Variables
        let lastTouchTime = 0;

        for(let i=0; i<80; i++) stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2 });

        function startGame() {
            menuOverlay.style.opacity = '0';
            setTimeout(() => {
                menuOverlay.style.display = 'none';
                document.getElementById('ui').style.display = 'block';
                document.getElementById('stats').style.display = 'block';
                gameActive = true;
                lastSpeedBoost = Date.now();
                draw();
            }, 500);
        }

        // --- INPUT HANDLING ---

        // Keyboard Logic
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyA' || e.code === 'KeyD') {
                let now = Date.now();
                if (now - keys[e.code + '_tap'] < 250) executeDash(e.code === 'KeyA' ? -1 : 1);
                keys[e.code + '_tap'] = now;
            }
            keys[e.code] = true;
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // Mouse Logic
        window.addEventListener('mousemove', (e) => { if(gameActive) playerX = e.clientX; });
        window.addEventListener('contextmenu', (e) => { e.preventDefault(); executeDash(playerX < canvas.width/2 ? 1 : -1); });

        // MOBILE TOUCH LOGIC
        canvas.addEventListener('touchstart', (e) => {
            if(!gameActive) return;
            e.preventDefault();
            
            // Double Tap Detection for Dash
            let now = Date.now();
            if (now - lastTouchTime < 300) {
                // Dash away from the side you are currently on
                executeDash(playerX < canvas.width/2 ? 1 : -1);
            }
            lastTouchTime = now;

            // Move to touch position
            playerX = e.touches[0].clientX;
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            if(!gameActive) return;
            e.preventDefault();
            playerX = e.touches[0].clientX;
        }, {passive: false});

        function executeDash(dir) {
            if (!dashAvailable || !gameActive) return;
            isDashing = true; dashAvailable = false;
            playerX += dir * 180;
            dashBar.style.width = "0%";
            setTimeout(() => { isDashing = false; }, 200);
            setTimeout(() => { dashAvailable = true; dashBar.style.width = "100%"; }, 3000);
        }

        function spawnObstacle() {
            let width = (score > 1000) ? 80 + Math.random() * 500 : (score >= 100 ? 258 : 220);
            obstacles.push({ x: Math.random() * (canvas.width - width), y: -50, w: width, h: 15 });
        }

        function update() {
            if (!gameActive) return;
            if (Date.now() - lastSpeedBoost > 8000) { baseSpeed += 1.3; lastSpeedBoost = Date.now(); }
            
            // Apply keyboard movement if keys are pressed
            const moveSpeed = 18 + (baseSpeed * 0.4);
            if (keys['KeyA'] || keys['ArrowLeft']) playerX -= moveSpeed;
            if (keys['KeyD'] || keys['ArrowRight']) playerX += moveSpeed;

            // Boundary Check
            if (playerX < hazardMargin || playerX > canvas.width - hazardMargin) { endGame("ZONE BREACHED"); }
            
            if (Math.random() < 0.035) spawnObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += baseSpeed;
                if (!isDashing && playerY > obs.y && playerY < obs.y + obs.h && playerX > obs.x && playerX < obs.x + obs.w) {
                    endGame("CRASH");
                }
                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score++;
                    scoreEl.innerText = score;
                }
            }
            stars.forEach(s => { s.y += baseSpeed * 0.4; if (s.y > canvas.height) s.y = 0; });
        }

        function draw() {
            if (!gameActive) return;
            ctx.fillStyle = '#000'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(0,0,0,0.7)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#fff";
            stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));

            // Hazard Lines
            ctx.strokeStyle = 'rgba(255, 0, 85, 0.3)';
            ctx.strokeRect(hazardMargin, 0, canvas.width - (hazardMargin*2), canvas.height);

            // Obstacles
            ctx.shadowBlur = 15;
            ctx.strokeStyle = score > 1000 ? '#ff0055' : (score > 100 ? '#ffcc00' : '#00f2ff');
            ctx.shadowColor = ctx.strokeStyle;
            obstacles.forEach(obs => ctx.strokeRect(obs.x, obs.y, obs.w, obs.h));

            // Player
            ctx.shadowColor = isDashing ? '#39ff14' : '#fff';
            ctx.fillStyle = isDashing ? '#39ff14' : '#fff';
            ctx.beginPath(); ctx.moveTo(playerX, playerY); ctx.lineTo(playerX - 12, playerY + 28); ctx.lineTo(playerX + 12, playerY + 28); ctx.fill();

            requestAnimationFrame(() => { update(); draw(); });
        }

        function endGame(reason) {
            gameActive = false;
            if (score > highScore) localStorage.setItem('hyperFlowBest', score);
            alert(`${reason}\nFinal Score: ${score}`);
            location.reload();
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
